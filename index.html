<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Мини слот-машина</title>
  <style>
    :root {
      --bg: #0c0a12;
      --panel: #161221;
      --gold: #e8c36a;
      --gold-dim: #b8943d;
      --win: #3dff8a;
      --lose: #ff5c7a;
      --text: #f4efe6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 0%, #2a1c3a 0%, transparent 55%), var(--bg);
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }
    body.jackpot-shake { animation: screenShake 0.12s linear infinite; }
    @keyframes screenShake {
      0% { transform: translate(0,0) rotate(0); }
      20% { transform: translate(-10px,6px) rotate(-1deg); }
      40% { transform: translate(12px,-8px) rotate(1.2deg); }
      60% { transform: translate(-8px,-5px) rotate(-0.8deg); }
      80% { transform: translate(9px,7px) rotate(0.6deg); }
      100% { transform: translate(0,0) rotate(0); }
    }
    .slot-block {
      width: min(440px, 94vw);
      background: linear-gradient(180deg, #1e1730 0%, var(--panel) 100%);
      border: 1px solid #3a2f4f;
      border-radius: 22px;
      padding: 22px 20px 18px;
      box-shadow: 0 0 0 1px rgba(232,195,106,0.12), 0 24px 50px rgba(0,0,0,0.45);
      position: relative;
      z-index: 2;
    }
    .slot-block.win-pulse {
      animation: blockPulse 0.18s linear infinite;
      box-shadow: 0 0 0 4px #fff, 0 0 40px #ff2bd6, 0 0 80px #ffe14a;
    }
    @keyframes blockPulse {
      0% { filter: hue-rotate(0deg) saturate(1.4); }
      50% { filter: hue-rotate(180deg) saturate(2); }
      100% { filter: hue-rotate(360deg) saturate(1.4); }
    }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .title { font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:700; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    .stat { background:#221a32; border:1px solid #3d3354; border-radius:12px; padding:8px 10px; }
    .stat span { display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#8f86a3; margin-bottom:4px; }
    .stat b { font-variant-numeric: tabular-nums; font-size:16px; }
    .stat.spent b { color: var(--lose); }
    .stat.earned b { color: var(--win); }
    .machine { background:#0a0810; border-radius:16px; padding:16px 12px 12px; border:1px solid #2c243d; position:relative; overflow:hidden; }
    .machine::before { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent 30%, transparent 70%, rgba(0,0,0,0.35)); }
    .reels { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .reel { height:118px; background:linear-gradient(180deg,#1a1426,#100c18); border-radius:12px; overflow:hidden; border:1px solid #3a3150; }
    .reel-window { height:100%; overflow:hidden; }
    .strip { display:flex; flex-direction:column; will-change:transform; }
    .symbol { height:118px; display:grid; place-items:center; font-size:54px; line-height:1; user-select:none; }
    .lights { display:flex; justify-content:center; gap:6px; margin:12px 0 4px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#3a3148; }
    .dot.on { background:var(--gold); box-shadow:0 0 8px var(--gold); }
    .controls { display:grid; grid-template-columns:1fr auto; gap:10px; margin-top:14px; align-items:center; }
    .status { min-height:42px; display:flex; align-items:center; font-size:14px; color:#c9c0d8; }
    .status.win { color:var(--win); font-weight:700; }
    .status.lose { color:#d7cfe4; }
    button.spin, button.refill {
      appearance:none; border:0; cursor:pointer; font-weight:800; letter-spacing:.08em;
      text-transform:uppercase; padding:12px 18px; border-radius:12px;
    }
    button.spin { background:linear-gradient(180deg,#f0d48a,var(--gold-dim)); color:#1a1208; box-shadow:0 8px 0 #7a5c1d; }
    button.spin:disabled { cursor:not-allowed; filter:grayscale(.3) brightness(.85); }
    button.refill { display:none; background:#2a2038; color:var(--gold); border:1px solid #5a4a28; }
    .broke .spin { display:none; }
    .broke .refill { display:inline-block; }
    .hint { margin-top:10px; font-size:11px; color:#8b829a; text-align:center; }
    .overlay { position:fixed; inset:0; display:none; place-items:center; z-index:20; pointer-events:none; }
    .overlay.show { display:grid; }
    .you-win {
      font-size: clamp(48px, 12vw, 110px); font-weight:900; letter-spacing:.04em;
      text-transform:uppercase; color:#fff; text-align:center; line-height:.9;
      text-shadow: 0 0 12px #ff0, 0 0 30px #ff2bd6, 0 0 60px #00e5ff, 4px 4px 0 #000;
      animation: winPop .18s linear infinite, hue .4s linear infinite;
    }
    .you-win small { display:block; font-size:.28em; margin-top:12px; letter-spacing:.12em; }
    @keyframes winPop {
      0% { transform:scale(1) rotate(-4deg); }
      50% { transform:scale(1.18) rotate(4deg); }
      100% { transform:scale(1) rotate(-4deg); }
    }
    @keyframes hue { from { filter:hue-rotate(0); } to { filter:hue-rotate(360deg); } }
    .flash { position:fixed; inset:0; display:none; z-index:10; pointer-events:none; animation:flashBg .12s linear infinite; }
    .flash.show { display:block; }
    @keyframes flashBg {
      0% { background:rgba(255,0,200,.35); }
      25% { background:rgba(255,230,0,.4); }
      50% { background:rgba(0,255,200,.35); }
      75% { background:rgba(80,80,255,.4); }
      100% { background:rgba(255,255,255,.45); }
    }
  </style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="overlay" id="overlay">
    <div class="you-win">YOU WIN!!!<small id="winAmount"></small></div>
  </div>
  <section class="slot-block" id="block">
    <div class="header"><div class="title">Lucky Reels</div></div>
    <div class="stats">
      <div class="stat spent"><span>Потрачено</span><b id="spent">0</b></div>
      <div class="stat earned"><span>Заработано</span><b id="earned">0</b></div>
    </div>
    <div class="machine">
      <div class="reels">
        <div class="reel"><div class="reel-window"><div class="strip" id="reel0"></div></div></div>
        <div class="reel"><div class="reel-window"><div class="strip" id="reel1"></div></div></div>
        <div class="reel"><div class="reel-window"><div class="strip" id="reel2"></div></div></div>
      </div>
      <div class="lights" id="lights"></div>
    </div>
    <div class="controls">
      <div class="status" id="status">Ставка 10 · джекпот до ×1 000 000 000</div>
      <button class="spin" id="spinBtn" type="button">Крутить</button>
      <button class="refill" id="refillBtn" type="button">Пополнить +100</button>
    </div>
    <p class="hint">Баланс для ставки: <b id="coins">100</b> · 7-7-7 мегаджекпот · одинаковые чаще</p>
  </section>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("#0c0a12"); tg.setBackgroundColor("#0c0a12"); } catch (e) {}
    }

    const SYMBOLS = ["🍒","🍋","🍊","🍇","⭐","7️⃣"];
    const BET = 10, REEL_SIZE = 24, START_COINS = 100;
    const coinsEl = document.getElementById("coins");
    const spentEl = document.getElementById("spent");
    const earnedEl = document.getElementById("earned");
    const statusEl = document.getElementById("status");
    const spinBtn = document.getElementById("spinBtn");
    const refillBtn = document.getElementById("refillBtn");
    const lightsEl = document.getElementById("lights");
    const blockEl = document.getElementById("block");
    const flashEl = document.getElementById("flash");
    const overlayEl = document.getElementById("overlay");
    const winAmountEl = document.getElementById("winAmount");
    let coins = START_COINS, spent = 0, earned = 0, spinning = false;
    for (let i = 0; i < 9; i++) {
      const d = document.createElement("div");
      d.className = "dot";
      lightsEl.appendChild(d);
    }
    function fmt(n) { return n.toLocaleString("ru-RU"); }
    function randSymbol() { return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]; }
    function pickResult() {
      const roll = Math.random();
      if (roll < 0.04) return ["7️⃣","7️⃣","7️⃣"];
      if (roll < 0.28) {
        const s = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
        return [s,s,s];
      }
      if (roll < 0.48) {
        const pair = Math.random() < 0.5 ? "7️⃣" : SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
        const other = randSymbol();
        const pos = Math.floor(Math.random()*3);
        const res = [pair,pair,pair];
        res[pos] = other;
        return res;
      }
      return [randSymbol(), randSymbol(), randSymbol()];
    }
    function buildStrip(el) {
      el.innerHTML = "";
      const items = [];
      for (let i = 0; i < REEL_SIZE; i++) items.push(randSymbol());
      items.forEach(s => {
        const div = document.createElement("div");
        div.className = "symbol";
        div.textContent = s;
        el.appendChild(div);
      });
      return items;
    }
    const reels = [0,1,2].map(i => {
      const el = document.getElementById("reel"+i);
      return { el, items: buildStrip(el) };
    });
    function setLights(on) {
      [...lightsEl.children].forEach((d,i) => {
        d.classList.toggle("on", on && i % 2 === ((Date.now()/80)|0)%2);
      });
    }
    function updateUI() {
      coinsEl.textContent = fmt(coins);
      spentEl.textContent = fmt(spent);
      earnedEl.textContent = fmt(earned);
      const broke = coins < BET;
      blockEl.classList.toggle("broke", broke);
      if (broke && !spinning) {
        statusEl.textContent = "Баланс закончился — пополните, чтобы крутить дальше";
        statusEl.className = "status lose";
        spinBtn.disabled = true;
      } else {
        spinBtn.disabled = spinning;
      }
    }
    function refill() {
      coins += START_COINS;
      statusEl.textContent = "Пополнено +100. Можно крутить";
      statusEl.className = "status win";
      updateUI();
    }
    function payout(result) {
      const [a,b,c] = result;
      if (a==="7️⃣" && b==="7️⃣" && c==="7️⃣") return { mul:1000000000, text:"МЕГАДЖЕКПОТ 7-7-7 ×1 000 000 000", mega:true };
      if (a===b && b===c) return { mul:25, text:"Три в ряд! ×25", mega:false };
      const sevens = result.filter(s => s==="7️⃣").length;
      if (sevens===2) return { mul:5, text:"Две семёрки! ×5", mega:false };
      if (a===b || b===c || a===c) return { mul:2, text:"Пара! ×2", mega:false };
      return { mul:0, text:"Почти... ещё спин", mega:false };
    }
    function celebrate(win, mega) {
      document.body.classList.add("jackpot-shake");
      blockEl.classList.add("win-pulse");
      flashEl.classList.add("show");
      overlayEl.classList.add("show");
      winAmountEl.textContent = "+"+fmt(win);
      [...lightsEl.children].forEach(d => d.classList.add("on"));
      setTimeout(function(){
        document.body.classList.remove("jackpot-shake");
        blockEl.classList.remove("win-pulse");
        flashEl.classList.remove("show");
        overlayEl.classList.remove("show");
        [...lightsEl.children].forEach(d => d.classList.remove("on"));
      }, mega ? 4200 : 1800);
    }
    function animateReel(reel, duration, finalSymbol) {
      return new Promise(resolve => {
        reel.items = buildStrip(reel.el);
        reel.items[REEL_SIZE-1] = finalSymbol;
        reel.el.lastElementChild.textContent = finalSymbol;
        const start = performance.now();
        const startY = 0;
        const endY = -(REEL_SIZE-1)*118;
        function frame(now) {
          const t = Math.min(1, (now-start)/duration);
          const ease = 1 - Math.pow(1-t, 3);
          reel.el.style.transform = "translateY("+(startY+(endY-startY)*ease)+"px)";
          if (t<1) requestAnimationFrame(frame);
          else resolve(finalSymbol);
        }
        requestAnimationFrame(frame);
      });
    }
    async function spin() {
      if (spinning) return;
      if (coins < BET) { updateUI(); return; }
      spinning = true;
      spinBtn.disabled = true;
      coins -= BET;
      spent += BET;
      updateUI();
      statusEl.textContent = "Крутим...";
      statusEl.className = "status";
      const lightTimer = setInterval(function(){ setLights(true); }, 70);
      const finals = pickResult();
      const results = await Promise.all(reels.map(function(reel,i){
        return animateReel(reel, 800+i*280, finals[i]);
      }));
      clearInterval(lightTimer);
      setLights(false);
      const pay = payout(results);
      if (pay.mul > 0) {
        const win = BET * pay.mul;
        coins += win;
        earned += win;
        statusEl.textContent = pay.text + "  +" + fmt(win);
        statusEl.className = "status win";
        celebrate(win, pay.mega);
      } else {
        statusEl.textContent = pay.text;
        statusEl.className = "status lose";
      }
      spinning = false;
      updateUI();
    }
    spinBtn.addEventListener("click", spin);
    refillBtn.addEventListener("click", refill);
    updateUI();
  </script>
</body>
</html>
