<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">alpasec | Терминал авторизации</title>
  <meta name="description" content="alpasec — терминал авторизации в контуре безопасности." />
  <link rel="icon" type="image/png" href="alpaca-dark.png" id="faviconLink" />
  
  <!-- Modern Unified Typography (Inter with Full Cyrillic & Latin Support) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       DESIGN SYSTEM: AERO GLASS, LIGHT/DARK DUAL THEME & NEON CYBER
       - Theme switcher on clicking the llama mascot
       - Dark theme: Lama in dark glasses (alpaca-dark.png)
       - Light theme: Lama in clear glasses (alpaca-light.png)
       - Simplified labels: "Имя пользователя", "Пароль", "ВОЙТИ"
       - Grey placeholder inputs
       - Minimal clean loading spinner with "Загрузка интерфейса..."
       ------------------------------------------------------------- */
    :root, [data-theme="dark"] {
      --bg-deep: #07080c;
      --bg-gradient: linear-gradient(180deg, #08090d 0%, #050608 100%);
      --ambient-radial-1: radial-gradient(circle 750px at 50% 50%, rgba(14, 165, 233, 0.09), transparent 75%);
      --ambient-radial-2: radial-gradient(circle 550px at 80% 30%, rgba(34, 211, 238, 0.045), transparent 70%);
      --ambient-radial-3: radial-gradient(circle 550px at 20% 70%, rgba(245, 158, 11, 0.035), transparent 70%);

      /* Frosted Glass Colors */
      --glass-panel: rgba(13, 16, 24, 0.54);
      --glass-border: rgba(56, 189, 248, 0.28);
      --glass-border-hover: rgba(56, 189, 248, 0.55);
      --glass-input: rgba(9, 12, 18, 0.65);
      --glass-input-focus: rgba(12, 16, 25, 0.9);

      /* Accents & Glow */
      --neon-blue: #0ea5e9;
      --neon-cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.4);
      --blue-glow-card: 
        0 25px 60px -15px rgba(0, 0, 0, 0.88),
        0 0 50px -5px rgba(14, 165, 233, 0.28),
        0 0 95px -10px rgba(6, 182, 212, 0.16),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.22);

      /* Typography */
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --nav-border: rgba(255, 255, 255, 0.08);
      --tabs-bg: rgba(9, 12, 18, 0.6);
      --logo-frame-bg: linear-gradient(145deg, rgba(22, 28, 38, 0.95), rgba(12, 16, 24, 0.95));
      --logo-frame-border: rgba(56, 189, 248, 0.35);
      --logo-frame-shadow: 0 0 16px rgba(14, 165, 233, 0.22), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      --modal-bg: rgba(10, 13, 20, 0.95);
    }

    [data-theme="light"] {
      --bg-deep: #f8fafc;
      --bg-gradient: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
      --ambient-radial-1: none;
      --ambient-radial-2: none;
      --ambient-radial-3: none;

      /* Frosted Glass Colors (Light) */
      --glass-panel: #ffffff;
      --glass-border: rgba(226, 232, 240, 0.95);
      --glass-border-hover: rgba(203, 213, 225, 1);
      --glass-input: #f8fafc;
      --glass-input-focus: #ffffff;

      /* Realistic Deep Shadow (Light) - NO blue glow */
      --neon-blue: #0284c7;
      --neon-cyan: #0284c7;
      --cyan-glow: transparent;
      --blue-glow-card: 
        0 25px 60px -12px rgba(15, 23, 42, 0.22),
        0 12px 24px -6px rgba(15, 23, 42, 0.12),
        0 2px 4px rgba(15, 23, 42, 0.05),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.95);

      /* Typography (Light) */
      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --nav-border: rgba(226, 232, 240, 0.85);
      --tabs-bg: #f1f5f9;
      --logo-frame-bg: transparent;
      --logo-frame-border: transparent;
      --logo-frame-shadow: none;
      --modal-bg: rgba(255, 255, 255, 0.98);
    }

    [data-theme="terminator"] {
      --bg-deep: #050204;
      --bg-gradient: radial-gradient(circle at 50% 40%, #1c0307 0%, #080102 70%, #000000 100%);
      --ambient-radial-1: radial-gradient(circle 800px at 50% 50%, rgba(255, 7, 58, 0.22), transparent 75%);
      --ambient-radial-2: radial-gradient(circle 600px at 85% 20%, rgba(220, 38, 38, 0.15), transparent 70%);
      --ambient-radial-3: radial-gradient(circle 600px at 15% 80%, rgba(255, 107, 0, 0.10), transparent 70%);

      /* Frosted Carbon & Blood-Red Glass */
      --glass-panel: rgba(18, 4, 7, 0.90);
      --glass-border: rgba(255, 26, 42, 0.70);
      --glass-border-hover: rgba(255, 7, 58, 1);
      --glass-input: rgba(10, 2, 4, 0.94);
      --glass-input-focus: #180307;

      /* Accents & Blood Red Glow */
      --neon-blue: #ff073a;
      --neon-cyan: #ff1a2a;
      --cyan-glow: rgba(255, 7, 58, 0.75);
      --blue-glow-card: 
        0 30px 80px -10px rgba(0, 0, 0, 0.98),
        0 0 50px rgba(255, 7, 58, 0.45),
        0 0 100px rgba(220, 38, 38, 0.25),
        inset 0 0 25px rgba(255, 7, 58, 0.18),
        inset 0 1px 1.5px rgba(255, 180, 180, 0.4);

      /* Typography */
      --text-main: #fff1f2;
      --text-sub: #fda4af;
      --text-muted: #f43f5e;
      --text-dim: #9f1239;
      --nav-border: rgba(255, 26, 42, 0.35);
      --tabs-bg: rgba(22, 3, 6, 0.88);
      --logo-frame-bg: linear-gradient(145deg, rgba(40, 5, 10, 0.95), rgba(15, 2, 4, 0.95));
      --logo-frame-border: rgba(255, 7, 58, 0.8);
      --logo-frame-shadow: 0 0 24px rgba(255, 7, 58, 0.7), inset 0 0 10px rgba(255, 7, 58, 0.5);
      --modal-bg: rgba(15, 2, 4, 0.98);
    }

    /* Terminator 2 Scanlines & CRT Raster Effect */
    [data-theme="terminator"]::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      opacity: 0.65;
    }

    [data-theme="terminator"]::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; height: 100vh;
      background: linear-gradient(180deg, transparent 0%, rgba(255, 7, 58, 0.08) 50%, transparent 100%);
      pointer-events: none;
      z-index: 998;
      animation: scanlineSweep 8s linear infinite;
    }

    @keyframes scanlineSweep {
      0% { transform: translateY(-100vh); }
      100% { transform: translateY(100vh); }
    }

    @keyframes terminatorTriggerShake {
      0% { transform: translate(0, 0) scale(1); filter: brightness(2) contrast(1.5); }
      10% { transform: translate(-8px, 6px) scale(1.02); filter: hue-rotate(180deg) invert(0.2); }
      20% { transform: translate(8px, -6px) scale(0.99); filter: brightness(2.5); }
      30% { transform: translate(-6px, -4px); }
      40% { transform: translate(6px, 4px); }
      50% { transform: translate(-3px, 2px); filter: brightness(1.5); }
      70% { transform: translate(3px, -2px); }
      100% { transform: translate(0, 0) scale(1); filter: none; }
    }

    .terminator-flash {
      animation: terminatorTriggerShake 0.75s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Terminator Theme HUD Overrides */
    .terminator-hud-banner {
      display: none;
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 700;
      color: #ff073a;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 18px;
      text-shadow: 0 0 12px rgba(255, 7, 58, 0.85);
      animation: blinkAlert 1.2s ease-in-out infinite alternate;
    }

    [data-theme="terminator"] .terminator-hud-banner {
      display: block;
    }

    @keyframes blinkAlert {
      0% { opacity: 0.65; }
      100% { opacity: 1; text-shadow: 0 0 18px rgba(255, 7, 58, 1); }
    }

    [data-theme="terminator"] .corner-bracket {
      display: block !important;
      border-color: #ff073a;
      box-shadow: 0 0 10px rgba(255, 7, 58, 0.8);
    }

    [data-theme="terminator"] .brand-logo-img {
      filter: drop-shadow(0 0 8px rgba(255, 7, 58, 0.9));
      animation: eyePulse 1.8s ease-in-out infinite;
    }

    @keyframes eyePulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 7, 58, 0.6)); }
      50% { filter: drop-shadow(0 0 18px rgba(255, 7, 58, 1)); }
    }

    [data-theme="terminator"] .submit-cta-btn {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 50%, #9f1239 100%);
      border: 1px solid rgba(255, 7, 58, 0.85);
      box-shadow: 0 0 25px rgba(255, 7, 58, 0.65), inset 0 1px 0 rgba(255, 200, 200, 0.4);
    }

    [data-theme="terminator"] .submit-cta-btn:hover {
      box-shadow: 0 0 35px rgba(255, 7, 58, 0.95), inset 0 1px 0 rgba(255, 200, 200, 0.7);
    }

    [data-theme="terminator"] .tactile-input:focus {
      border-color: #ff073a;
      box-shadow: 0 0 16px rgba(255, 7, 58, 0.5);
    }

    [data-theme="terminator"] .loading-spinner {
      border-color: rgba(255, 7, 58, 0.25);
      border-top-color: #ff073a;
      box-shadow: 0 0 25px rgba(255, 7, 58, 0.6);
    }

    [data-theme="terminator"] .loading-label {
      color: #ff073a;
      text-shadow: 0 0 10px rgba(255, 7, 58, 0.8);
      letter-spacing: 0.1em;
    }

    [data-theme="terminator"] .loading-modal {
      background: rgba(10, 1, 3, 0.96);
      border: 1px solid rgba(255, 7, 58, 0.6);
      box-shadow: 0 0 40px rgba(255, 7, 58, 0.5);
    }

    [data-theme="terminator"] .auth-tab-btn.active {
      color: #ff073a;
      background: rgba(255, 7, 58, 0.15);
      box-shadow: 0 0 16px rgba(255, 7, 58, 0.35);
      border-bottom: 2px solid #ff073a;
    }

    [data-theme="terminator"] .input-addon-btn:hover {
      color: #ff073a;
      border-color: rgba(255, 7, 58, 0.5);
      box-shadow: 0 0 12px rgba(255, 7, 58, 0.4);
    }

    [data-theme="terminator"] .forgot-link:hover {
      color: #ff073a;
      text-shadow: 0 0 8px rgba(255, 7, 58, 0.8);
    }

    .primed-glow {
      box-shadow: 0 0 25px rgba(255, 7, 58, 0.95), inset 0 0 10px rgba(255, 7, 58, 0.4) !important;
      border-color: #ff073a !important;
      animation: primedPulse 1.2s ease-in-out infinite alternate !important;
    }

    @keyframes primedPulse {
      0% { box-shadow: 0 0 12px rgba(255, 7, 58, 0.6); }
      100% { box-shadow: 0 0 28px rgba(255, 7, 58, 1); }
    }

    /* Skynet HUD Toast */
    .skynet-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(15, 2, 4, 0.96);
      border: 1px solid #ff073a;
      box-shadow: 0 0 35px rgba(255, 7, 58, 0.85), inset 0 0 15px rgba(255, 7, 58, 0.3);
      color: #ff073a;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.45s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skynet-toast.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    :root {
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-brand: var(--font-main);
      --font-body: var(--font-main);
      --font-mono: var(--font-main);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    input, button, select, textarea, a {
      font-family: inherit;
    }

    /* -------------------------------------------------------------
       BACKGROUND: Radiating Circuit Canvas & Ambient Glow
       ------------------------------------------------------------- */
    #circuit-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: var(--ambient-radial-1), var(--ambient-radial-2), var(--ambient-radial-3), var(--bg-gradient);
      transition: background 0.4s ease;
    }

    /* Viewport Wrapper */
    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* -------------------------------------------------------------
       HEADER: Aero Glass Bar
       ------------------------------------------------------------- */
    .header-nav {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--nav-border);
      position: relative;
      transition: border-color 0.3s ease;
    }

    /* Brand Logo Lockup: Interactive Theme-Toggle Llama Mascot Badge + alpasec Typography */
    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      user-select: none;
    }

    .brand-logo-frame {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--logo-frame-bg);
      border: 1.5px solid var(--logo-frame-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--logo-frame-shadow);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }

    [data-theme="dark"] .brand-logo-frame:hover {
      border-color: var(--neon-cyan);
      box-shadow: 
        0 0 24px rgba(34, 211, 238, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.45);
      transform: scale(1.08);
    }

    [data-theme="light"] .brand-logo-frame:hover {
      transform: scale(1.08);
    }

    .brand-logo-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    [data-theme="dark"] .brand-logo-img {
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .brand-name {
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.03em;
      color: var(--text-main);
      line-height: 1;
      display: inline-flex;
      align-items: baseline;
      transition: color 0.3s ease;
    }

    .brand-name .brand-dot {
      color: var(--neon-cyan);
      font-weight: 800;
      margin-left: 1px;
      text-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
    }

    /* Right Header Navigation: Interactive Language Switcher */
    .header-right-hud {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .lang-toggle-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-main);
      font-size: 11px;
      color: var(--text-dim);
      background: var(--tabs-bg);
      border: 1px solid var(--nav-border);
      border-radius: 6px;
      padding: 3px 6px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      color: #ffffff;
      background: var(--neon-blue);
      box-shadow: 0 0 8px rgba(14, 165, 233, 0.35);
    }

    .lang-btn:hover:not(.active) {
      color: var(--text-main);
    }

    .lang-divider {
      opacity: 0.35;
    }

    /* -------------------------------------------------------------
       MAIN: Centered Frosted Glass Console with Neon Glow
       ------------------------------------------------------------- */
    .main-center-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }

    .terminal-wrapper {
      width: 100%;
      max-width: 470px;
      position: relative;
    }

    /* The Main Frosted Glass Hardware Card */
    .hardware-frame {
      position: relative;
      background: var(--glass-panel);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 38px 34px 34px 34px;
      box-shadow: var(--blue-glow-card);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      overflow: hidden;
    }

    .hardware-frame:hover {
      border-color: var(--glass-border-hover);
    }

    /* Corner Industrial Brackets (removed per user request) */
    .corner-bracket {
      display: none !important;
    }

    /* Mode Tabs (Credentials vs SSO) */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--tabs-bg);
      border: 1px solid var(--nav-border);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .auth-tab-btn {
      background: transparent;
      border: none;
      padding: 10px 12px;
      font-family: var(--font-main);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .auth-tab-btn:hover:not(.active) {
      color: var(--text-main);
    }

    .auth-tab-btn.active {
      background: rgba(14, 165, 233, 0.16);
      color: var(--neon-blue);
      border: 1px solid var(--glass-border);
      box-shadow: 0 0 14px rgba(14, 165, 233, 0.22);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 22px;
    }

    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-label {
      font-family: var(--font-main);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .forgot-link {
      font-family: var(--font-main);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--neon-cyan);
      text-decoration: none;
      transition: all 0.2s;
    }

    .forgot-link:hover {
      text-decoration: underline;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .tactile-input {
      width: 100%;
      height: 48px;
      background: var(--glass-input);
      border: 1px solid var(--glass-border);
      border-radius: 7px;
      padding: 0 16px;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 400;
      color: var(--text-main);
      outline: none;
      transition: all 0.25s ease;
    }

    .tactile-input:focus {
      background: var(--glass-input-focus);
      border-color: var(--neon-cyan);
      box-shadow: 
        0 0 18px rgba(14, 165, 233, 0.28),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    [data-theme="light"] .tactile-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    /* Grey placeholder styling */
    .tactile-input::placeholder {
      color: var(--text-dim);
      opacity: 0.75;
      font-weight: 400;
    }

    .input-addon-btn {
      position: absolute;
      right: 12px;
      background: var(--tabs-bg);
      border: 1px solid var(--nav-border);
      color: var(--text-muted);
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .input-addon-btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--neon-cyan);
    }

    /* Primary CTA Button (ВОЙТИ) */
    .submit-cta-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      border: 1px solid rgba(56, 189, 248, 0.7);
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 7px;
      cursor: pointer;

    // -------------------------------------------------------------

    // -------------------------------------------------------------
    (() => {
      const canvas = document.getElementById("circuit-canvas");
      const ctx = canvas.getContext("2d");
      const authCard = document.getElementById("authCard");
      let dpr = 1;
      let width = 0;
      let height = 0;

      // Palettes for Dark, Light, and Terminator 2 themes
      const PALETTES_DARK = [
        { stroke: "rgba(34, 211, 238, 0.17)", pulse: "#38bdf8", glow: "rgba(56, 189, 248, 0.45)", node: "rgba(34, 211, 238, 0.45)" },
        { stroke: "rgba(245, 158, 11, 0.15)", pulse: "#fbbf24", glow: "rgba(251, 191, 36, 0.45)", node: "rgba(251, 191, 36, 0.45)" },
        { stroke: "rgba(192, 132, 252, 0.16)", pulse: "#e879f9", glow: "rgba(232, 121, 249, 0.45)", node: "rgba(232, 121, 249, 0.45)" },

      const PALETTES_LIGHT = [
        { stroke: "rgba(2, 132, 199, 0.40)", pulse: "#0284c7", glow: "rgba(14, 165, 233, 0.28)", node: "rgba(2, 132, 199, 0.70)" },
        { stroke: "rgba(217, 119, 6, 0.38)", pulse: "#d97706", glow: "rgba(245, 158, 11, 0.28)", node: "rgba(217, 119, 6, 0.70)" },
        { stroke: "rgba(147, 51, 234, 0.38)", pulse: "#9333ea", glow: "rgba(168, 85, 247, 0.28)", node: "rgba(147, 51, 234, 0.70)" },
        { stroke: "rgba(13, 148, 136, 0.38)", pulse: "#0d9488", glow: "rgba(20, 184, 166, 0.28)", node: "rgba(13, 148, 136, 0.70)" }
      ];

      const PALETTES_TERMINATOR = [
        { stroke: "rgba(255, 7, 58, 0.52)", pulse: "#ff073a", glow: "rgba(255, 7, 58, 0.85)", node: "rgba(255, 7, 58, 0.90)" },

        { stroke: "rgba(249, 115, 22, 0.45)", pulse: "#fb923c", glow: "rgba(249, 115, 22, 0.75)", node: "rgba(249, 115, 22, 0.80)" },
        { stroke: "rgba(225, 29, 72, 0.50)", pulse: "#f43f5e", glow: "rgba(225, 29, 72, 0.80)", node: "rgba(225, 29, 72, 0.85)" }
      ];

      const circuits = [];
      const bgDots = [];

      const initBgDots = () => {
        bgDots.length = 0;
        const count = Math.max(35, Math.min(220, Math.round((width * height) / 38000)));
        for (let i = 0; i < count; i++) {
          bgDots.push({
            x: Math.random() * (width || window.innerWidth),
            y: Math.random() * (height || window.innerHeight),
            radius: Math.random() * 1.5 + 0.7,
            speedY: -(0.08 + Math.random() * 0.14),
            speedX: (Math.random() - 0.5) * 0.06,
            alpha: 0.08 + Math.random() * 0.22,
            color: Math.random() > 0.5 ? "rgba(56, 189, 248, " : "rgba(251, 191, 36, "
          });
        }
      };

      const shuffle = (arr) => arr.slice().sort(() => Math.random() - 0.5);
      const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

      const createBranch = (anchor, steps, theme, idx) => {
        let baseLen = 0;
        for (let s of steps) {
          baseLen += Math.hypot(s.dx, s.dy);
        }

        const packets = [
          {
            progress: Math.random() * Math.max(10, baseLen * 0.8),
            speed: 0.22 + Math.random() * 0.15,
            size: 1.8
          },
          {
            progress: Math.max(20, Math.random() * baseLen),
            speed: -(0.20 + Math.random() * 0.15),
            size: 1.6
          }
        ];

        return {
          anchor,
          steps,
          paletteIndex: idx,
          theme,
          packets,
          growDelay: idx * 110,
          growDuration: 2600 + Math.random() * 800
        };
      };

      const generateUniqueCircuits = () => {
        circuits.length = 0;
        const w = window.innerWidth;
        const h = window.innerHeight;
        const diag = Math.hypot(w, h);

        const scale = Math.max(0.9, Math.min(2.5, diag / 2200));

        const leftCount = Math.max(2, Math.round(3 * scale));
        const rightCount = Math.max(2, Math.round(3 * scale));
        const topCount = Math.max(1, Math.round(2 * scale));
        const bottomCount = Math.max(1, Math.round(2 * scale));

        let activePalettes;
        if (currentTheme === 'terminator') {
          activePalettes = PALETTES_TERMINATOR;
        } else if (currentTheme === 'light') {
          activePalettes = PALETTES_LIGHT;
        } else {
          activePalettes = PALETTES_DARK;
        }
        const themes = shuffle(activePalettes);

        const genSideSteps = (dirX, isUpper) => {
          const steps = [];
          const stepScale = Math.max(1, scale * 1.15);

          steps.push({ dx: dirX * randInt(Math.round(80 * stepScale), Math.round(180 * stepScale)), dy: 0 });

          const dirY = isUpper ? -1 : 1;
          steps.push({ dx: 0, dy: dirY * randInt(Math.round(60 * stepScale), Math.round(150 * stepScale)) });

          steps.push({ dx: dirX * randInt(Math.round(90 * stepScale), Math.round(220 * stepScale)), dy: 0 });

          if (scale > 1.1 || Math.random() > 0.3) {
            steps.push({ dx: 0, dy: (Math.random() > 0.5 ? -1 : 1) * randInt(Math.round(40 * stepScale), Math.round(100 * stepScale)) });
            steps.push({ dx: dirX * randInt(Math.round(80 * stepScale), Math.round(200 * stepScale)), dy: 0 });
          }

          if (scale > 1.5 && Math.random() > 0.25) {
            steps.push({ dx: 0, dy: (Math.random() > 0.5 ? -1 : 1) * randInt(Math.round(50 * stepScale), Math.round(120 * stepScale)) });
            steps.push({ dx: dirX * randInt(Math.round(90 * stepScale), Math.round(240 * stepScale)), dy: 0 });
          }

          return steps;
        };

        const genTopBottomSteps = (dirY) => {
          const steps = [];
          const stepScale = Math.max(1, scale * 1.15);

          steps.push({ dx: 0, dy: dirY * randInt(Math.round(50 * stepScale), Math.round(130 * stepScale)) });

          const dirX = Math.random() > 0.5 ? 1 : -1;
          steps.push({ dx: dirX * randInt(Math.round(70 * stepScale), Math.round(180 * stepScale)), dy: 0 });

          steps.push({ dx: 0, dy: dirY * randInt(Math.round(50 * stepScale), Math.round(150 * stepScale)) });

          if (scale > 1.2 || Math.random() > 0.35) {
            steps.push({ dx: -dirX * randInt(Math.round(60 * stepScale), Math.round(150 * stepScale)), dy: 0 });
            steps.push({ dx: 0, dy: dirY * randInt(Math.round(40 * stepScale), Math.round(110 * stepScale)) });
          }

          return steps;
        };

        let branchIdx = 0;

        for (let i = 0; i < leftCount; i++) {
          const ratio = 0.12 + (0.76 * (i / Math.max(1, leftCount - 1))) + (Math.random() * 0.05 - 0.025);
          const isUpper = ratio < 0.5;
          circuits.push(createBranch({ side: 'left', ratio: Math.max(0.08, Math.min(0.92, ratio)) }, genSideSteps(-1, isUpper), themes[branchIdx++ % themes.length], branchIdx));
        }

        for (let i = 0; i < rightCount; i++) {
          const ratio = 0.12 + (0.76 * (i / Math.max(1, rightCount - 1))) + (Math.random() * 0.05 - 0.025);
          const isUpper = ratio < 0.5;
          circuits.push(createBranch({ side: 'right', ratio: Math.max(0.08, Math.min(0.92, ratio)) }, genSideSteps(1, isUpper), themes[branchIdx++ % themes.length], branchIdx));
        }

        for (let i = 0; i < topCount; i++) {
          const ratio = 0.18 + (0.64 * (i / Math.max(1, topCount - 1))) + (Math.random() * 0.05 - 0.025);
          circuits.push(createBranch({ side: 'top', ratio: Math.max(0.12, Math.min(0.88, ratio)) }, genTopBottomSteps(-1), themes[branchIdx++ % themes.length], branchIdx));
        }

        for (let i = 0; i < bottomCount; i++) {
          const ratio = 0.18 + (0.64 * (i / Math.max(1, bottomCount - 1))) + (Math.random() * 0.05 - 0.025);
          circuits.push(createBranch({ side: 'bottom', ratio: Math.max(0.12, Math.min(0.88, ratio)) }, genTopBottomSteps(1), themes[branchIdx++ % themes.length], branchIdx));
        }
      };

      const resize = () => {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        initBgDots();
      };

      const getPosAt = (segments, totalLen, dist) => {
        const d = ((dist % totalLen) + totalLen) % totalLen;
        for (let i = 0; i < segments.length; i++) {
          const seg = segments[i];
          if (d >= seg.startAt && d <= seg.startAt + seg.length) {
            const r = seg.length === 0 ? 0 : (d - seg.startAt) / seg.length;
            return {
              x: seg.p1.x + (seg.p2.x - seg.p1.x) * r,
              y: seg.p1.y + (seg.p2.y - seg.p1.y) * r
            };
          }
        }
        return segments[0].p1;
      };

      // Main Render Loop
      const draw = (now) => {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        const isTerminator = (currentTheme === 'terminator');
        const isLight = (currentTheme === 'light');

        // 1. Background floating points
        for (let i = 0; i < bgDots.length; i++) {
          const dot = bgDots[i];
          dot.y += dot.speedY * (isTerminator ? 1.6 : 1);
          dot.x += dot.speedX;
          if (dot.y < -10) dot.y = height + 10;
          if (dot.x < -10) dot.x = width + 10;
          if (dot.x > width + 10) dot.x = -10;

          ctx.beginPath();
          ctx.arc(dot.x, dot.y, isTerminator ? dot.radius * 1.25 : dot.radius, 0, Math.PI * 2);
          if (isTerminator) {
            ctx.fillStyle = `rgba(255, 7, 58, ${dot.alpha * 0.75})`;
          } else if (isLight) {
            ctx.fillStyle = `rgba(2, 132, 199, ${dot.alpha * 0.6})`;
          } else {
            ctx.fillStyle = (dot.color + dot.alpha + ")");
          }
          ctx.fill();
        }

        // 2. Subtle architectural grid coordinate dots
        const gridStep = 48;
        if (isTerminator) {
          ctx.fillStyle = "rgba(255, 7, 58, 0.05)";
        } else if (isLight) {
          ctx.fillStyle = "rgba(15, 23, 42, 0.025)";
        } else {
          ctx.fillStyle = "rgba(255, 255, 255, 0.012)";
        }
        for (let x = gridStep / 2; x < width; x += gridStep) {
          for (let y = gridStep / 2; y < height; y += gridStep) {
            ctx.fillRect(x, y, 1, 1);
          }
        }

        if (!authCard) return;
        const rect = authCard.getBoundingClientRect();
        if (!rect || rect.width === 0) return;

        // 3. Render radiating circuit lines
        for (let c = 0; c < circuits.length; c++) {
          const circuit = circuits[c];
          let activePalettes;
          if (isTerminator) activePalettes = PALETTES_TERMINATOR;
          else if (isLight) activePalettes = PALETTES_LIGHT;
          else activePalettes = PALETTES_DARK;

          const theme = activePalettes[circuit.paletteIndex % activePalettes.length] || circuit.theme;
          const { anchor, steps, packets, growDelay, growDuration } = circuit;

          let p0;
          if (anchor.side === 'left') {
            p0 = { x: rect.left, y: rect.top + rect.height * anchor.ratio };
          } else if (anchor.side === 'right') {
            p0 = { x: rect.right, y: rect.top + rect.height * anchor.ratio };
          } else if (anchor.side === 'top') {
            p0 = { x: rect.left + rect.width * anchor.ratio, y: rect.top };
          } else {
            p0 = { x: rect.left + rect.width * anchor.ratio, y: rect.bottom };
          }

          const points = [p0];
          let cur = p0;
          for (let s = 0; s < steps.length; s++) {
            cur = {
              x: Math.max(30, Math.min(width - 30, cur.x + steps[s].dx)),
              y: Math.max(50, Math.min(height - 40, cur.y + steps[s].dy))
            };
            points.push(cur);
          }

          let totalLen = 0;
          const segments = [];
          for (let i = 0; i < points.length - 1; i++) {
            const p1 = points[i];
            const p2 = points[i + 1];
            const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            segments.push({ p1, p2, length: d, startAt: totalLen });
            totalLen += d;
          }

          if (totalLen <= 0) continue;

          const elapsed = Math.max(0, now - introStartTime - growDelay);
          const rawProgress = Math.min(1, elapsed / growDuration);
          const easeProgress = 1 - Math.pow(1 - rawProgress, 2.8);
          const currentDrawDist = totalLen * easeProgress;
          const isFullyGrown = (rawProgress >= 1);

          if (currentDrawDist <= 0) continue;

          let tipPos = points[0];
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);

          for (let i = 0; i < segments.length; i++) {
            const seg = segments[i];
            if (currentDrawDist >= seg.startAt + seg.length) {
              ctx.lineTo(seg.p2.x, seg.p2.y);
              tipPos = seg.p2;
            } else if (currentDrawDist > seg.startAt) {
              const r = (currentDrawDist - seg.startAt) / seg.length;
              tipPos = {
                x: seg.p1.x + (seg.p2.x - seg.p1.x) * r,
                y: seg.p1.y + (seg.p2.y - seg.p1.y) * r
              };
              ctx.lineTo(tipPos.x, tipPos.y);
              break;
            } else {
              break;
            }
          }
          ctx.strokeStyle = theme.stroke;
          ctx.lineWidth = isTerminator ? 1.45 : (isLight ? 1.25 : 0.95);
          ctx.stroke();

          // Spark head during growth
          if (!isFullyGrown) {
            ctx.save();
            ctx.shadowColor = theme.glow;
            ctx.shadowBlur = isTerminator ? 10 : 6;
            ctx.beginPath();
            ctx.arc(tipPos.x, tipPos.y, isTerminator ? 2.2 : 1.8, 0, Math.PI * 2);
            ctx.fillStyle = isTerminator ? "#ff073a" : (isLight ? "rgba(2, 132, 199, 0.9)" : "rgba(255, 255, 255, 0.85)");
            ctx.fill();
            ctx.restore();
          }

          // Node circles & contact pins
          for (let i = 0; i < points.length; i++) {
            const pt = points[i];
            const nodeDist = (i === 0) ? 0 : (segments[i - 1].startAt + segments[i - 1].length);

            if (currentDrawDist >= nodeDist) {
              const isOrigin = (i === 0);
              const isTerminal = (i === points.length - 1);
              const timeSinceReached = Math.max(0, currentDrawDist - nodeDist);
              const nodeAlpha = Math.min(1, timeSinceReached / 25);

              ctx.save();
              if (isOrigin) {
                ctx.globalAlpha = isTerminator ? 0.95 : (isLight ? (nodeAlpha * 0.75) : (nodeAlpha * 0.55));
                ctx.shadowColor = theme.glow;
                ctx.shadowBlur = isTerminator ? 8 : (isLight ? 3 : 5);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, isTerminator ? 2.5 : (isLight ? 2.3 : 2.0), 0, Math.PI * 2);
                ctx.fillStyle = theme.node;
                ctx.fill();
              } else {
                ctx.globalAlpha = isTerminator ? 0.85 : (isLight ? (nodeAlpha * 0.65) : (nodeAlpha * 0.42));
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, isTerminal ? (isTerminator ? 4.6 : 4.2) : 3.2, 0, Math.PI * 2);
                ctx.strokeStyle = theme.node;
                ctx.lineWidth = isTerminator ? 1.35 : (isLight ? 1.2 : 0.9);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(pt.x, pt.y, isTerminal ? 1.8 : 1.2, 0, Math.PI * 2);
                ctx.fillStyle = theme.node;
                ctx.fill();
              }
              ctx.restore();
            }
          }

          // Bidirectional Packets
          if (isFullyGrown && packets && packets.length > 0) {
            for (let p = 0; p < packets.length; p++) {
              const pkt = packets[p];
              pkt.progress += pkt.speed * (isTerminator ? 1.35 : 1);

              if (pkt.speed > 0 && pkt.progress >= totalLen) {
                pkt.progress = totalLen;
                pkt.speed = -(0.20 + Math.random() * 0.15);
              } else if (pkt.speed < 0 && pkt.progress <= 0) {
                pkt.progress = 0;
                pkt.speed = (0.22 + Math.random() * 0.15);
              }

              const head = getPosAt(segments, totalLen, pkt.progress);
              const isOutward = pkt.speed > 0;
              const trailLen = 14;

              for (let t = 1; t <= 4; t++) {
                const tailDist = isOutward 
                  ? pkt.progress - (t * (trailLen / 4))
                  : pkt.progress + (t * (trailLen / 4));

                if (tailDist >= 0 && tailDist <= totalLen) {
                  const tailPos = getPosAt(segments, totalLen, tailDist);
                  const alpha = isTerminator ? ((1 - t / 5) * 0.45) : (isLight ? ((1 - t / 5) * 0.35) : ((1 - t / 5) * 0.22));
                  ctx.beginPath();
                  ctx.arc(tailPos.x, tailPos.y, 1.0, 0, Math.PI * 2);
                  ctx.fillStyle = isTerminator ? theme.pulse : (isLight ? theme.pulse : theme.glow);
                  ctx.globalAlpha = alpha;
                  ctx.fill();
                }
              }
              ctx.globalAlpha = 1.0;

              ctx.save();
              ctx.shadowColor = theme.glow;
              ctx.shadowBlur = isTerminator ? 10 : 6;
              ctx.beginPath();
              ctx.arc(head.x, head.y, isTerminator ? (pkt.size * 1.3) : (isLight ? (pkt.size * 1.2) : pkt.size), 0, Math.PI * 2);
              ctx.fillStyle = isTerminator ? "#ff073a" : (isLight ? theme.pulse : "rgba(255, 255, 255, 0.85)");
              ctx.fill();
              ctx.restore();
            }
          }
        }
      };

      let animId;
      const loop = (now) => {
        draw(now);
        animId = requestAnimationFrame(loop);
      };

      window.addEventListener("resize", () => {
        resize();
        generateUniqueCircuits();
      });

      // Expose circuit regeneration for theme changes
      window.__triggerCircuitRegen = () => {
        generateUniqueCircuits();
        introStartTime = performance.now();
      };

      // Initialize
      applyTheme(currentTheme);
      generateUniqueCircuits();
      resize();
      introStartTime = performance.now();
      loop(performance.now());
    })();

    // -------------------------------------------------------------
    // PROCEDURAL AUDIO SYNTHESIZER (Web Audio API)
    // - High-tech cyber clicks with escalating pitch
    // - Brad Fiedel Terminator 2 theme: 5-beat metallic clang + dark brass drone
    // -------------------------------------------------------------
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playCyberTick(step) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        const baseFreq = 480 + (step * 45);
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.045);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.05);
      } catch (e) {
        console.warn('Audio click error:', e);
      }
    }

    function playTerminatorThemeSound() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        // 1. Brad Fiedel's iconic 5-beat metallic clang: DUN-DUN  DUN  DA-DUN
        const beatOffsets = [0.0, 0.28, 0.60, 0.98, 1.18];

        beatOffsets.forEach((offset, idx) => {
          const t = now + offset;
          const isHeavy = (idx === 0 || idx === 2 || idx === 3);

          // Sub-bass anvil thud
          const subOsc = ctx.createOscillator();
          const subGain = ctx.createGain();
          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(isHeavy ? 65 : 75, t);
          subOsc.frequency.exponentialRampToValueAtTime(28, t + 0.22);
          subGain.gain.setValueAtTime(isHeavy ? 0.45 : 0.3, t);
          subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          subOsc.connect(subGain);
          subGain.connect(ctx.destination);
          subOsc.start(t);
          subOsc.stop(t + 0.24);

          // Metallic noise strike
          const bufferSize = Math.round(ctx.sampleRate * 0.12);
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(isHeavy ? 1100 : 1350, t);
          filter.Q.setValueAtTime(6.0, t);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(isHeavy ? 0.35 : 0.22, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

          whiteNoise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          whiteNoise.start(t);
          whiteNoise.stop(t + 0.13);

          // Metallic ring overtone (sawtooth clang)
          const clangOsc = ctx.createOscillator();
          const clangGain = ctx.createGain();
          clangOsc.type = 'sawtooth';
          clangOsc.frequency.setValueAtTime(isHeavy ? 880 : 960, t);
          clangGain.gain.setValueAtTime(0.12, t);
          clangGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          clangOsc.connect(clangGain);
          clangGain.connect(ctx.destination);
          clangOsc.start(t);
          clangOsc.stop(t + 0.2);
        });

        // 2. Ominous Skynet Synth Brass Drone (enters right after the 5-note motif)
        const droneTime = now + 1.45;
        const freqs = [73.42, 110.0, 146.83, 174.61]; // D2, A2, D3, F3 (Dark D minor)

        freqs.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq + (i % 2 === 0 ? -0.8 : 0.8), droneTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(450, droneTime);
          filter.frequency.exponentialRampToValueAtTime(1800, droneTime + 0.5);
          filter.frequency.exponentialRampToValueAtTime(320, droneTime + 3.2);

          gain.gain.setValueAtTime(0.001, droneTime);
          gain.gain.linearRampToValueAtTime(0.16, droneTime + 0.35);
          gain.gain.exponentialRampToValueAtTime(0.001, droneTime + 3.5);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(droneTime);
          osc.stop(droneTime + 3.6);
        });

        // 3. Cyberdyne Klaxon Sweep
        const klaxon = ctx.createOscillator();
        const kGain = ctx.createGain();
        klaxon.type = 'sine';
        klaxon.frequency.setValueAtTime(1200, now + 0.05);
        klaxon.frequency.exponentialRampToValueAtTime(400, now + 0.8);
        kGain.gain.setValueAtTime(0.12, now + 0.05);
        kGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        klaxon.connect(kGain);
        kGain.connect(ctx.destination);
        klaxon.start(now + 0.05);
        klaxon.stop(now + 0.82);

      } catch (err) {
        console.warn('Audio synthesis warning:', err);
      }
    }

    // -------------------------------------------------------------
    // EASTER EGG SEQUENCE LOGIC:
    // 1. Click 10 times consecutively on theme switcher (llama mascot)
    // 2. Click 13 times on password toggle button ("ПОКАЗАТЬ")
    // => TRANSFORMS TO TERMINATOR 2 JUDGMENT DAY / SKYNET DEFENSE MATRIX
    // -------------------------------------------------------------
    function onThemeMascotClick() {
      if (isTerminatorActive) {
        // Clicking mascot in Terminator mode exits back to normal dark theme
        deactivateTerminatorTheme();
        return;
      }

      // Pre-warm Web Audio API on user gesture
      getAudioCtx();

      // Normal theme toggle (dark <-> light)
      toggleTheme();

      // Reset timer for sequence: 60 seconds
      clearTimeout(streakResetTimer);
      streakResetTimer = setTimeout(() => {
        themeClickStreak = 0;
        passShowClickStreak = 0;
        const mascot = document.getElementById('themeToggleBtn');
        if (mascot) mascot.classList.remove('primed-glow');
      }, 60000);

      // If user starts clicking theme again after starting pass clicks, reset pass clicks
      passShowClickStreak = 0;
      themeClickStreak++;

      console.log(`[EasterEgg] Mascot theme clicks: ${themeClickStreak}/10`);

      // Visual indicator when primed at 10 clicks
      const mascot = document.getElementById('themeToggleBtn');
      if (themeClickStreak >= 10) {
        if (mascot) mascot.classList.add('primed-glow');
      } else {
        if (mascot) mascot.classList.remove('primed-glow');
      }
    }

    function onPassToggleClick() {
      // Normal password toggle behavior
      togglePassVisibility();

      if (isTerminatorActive) return;

      // Pre-warm audio
      getAudioCtx();

      // Only count towards easter egg if theme toggle was clicked at least 10 times
      if (themeClickStreak >= 10) {
        clearTimeout(streakResetTimer);
        streakResetTimer = setTimeout(() => {
          themeClickStreak = 0;
          passShowClickStreak = 0;
          const mascot = document.getElementById('themeToggleBtn');
          if (mascot) mascot.classList.remove('primed-glow');
        }, 60000);

        passShowClickStreak++;
        console.log(`[EasterEgg] Password show clicks: ${passShowClickStreak}/13`);
        playCyberTick(passShowClickStreak);

        if (passShowClickStreak >= 13) {
          console.log("[EasterEgg] >>> SKYNET DEFENSE NETWORK ACTIVATED! <<<");
          activateTerminatorTheme();
          themeClickStreak = 0;
          passShowClickStreak = 0;
          const mascot = document.getElementById('themeToggleBtn');
          if (mascot) mascot.classList.remove('primed-glow');
        }
      } else {
        passShowClickStreak = 0;
      }
    }

    function activateTerminatorTheme() {
      applyTheme('terminator');

      // Glitch screen shake
      document.body.classList.add('terminator-flash');
      setTimeout(() => document.body.classList.remove('terminator-flash'), 1000);

      // Display Skynet DEFCON 1 toast
      const toast = document.getElementById('skynetToast');
      if (toast) {
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 5200);
      }

      // Play Brad Fiedel Terminator 2 theme & cyber klaxon
      playTerminatorThemeSound();
    }

    function deactivateTerminatorTheme() {
      themeClickStreak = 0;
      passShowClickStreak = 0;
      const mascot = document.getElementById('themeToggleBtn');
      if (mascot) mascot.classList.remove('primed-glow');
      applyTheme('dark');
      if (window.__triggerCircuitRegen) {
        window.__triggerCircuitRegen();
      }
    }
  </script>

</body>
